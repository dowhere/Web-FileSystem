name: web-filesystem

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: web-filesystem:latest
    restart: unless-stopped
    init: true
    ports:
      - '${WF_BIND:-0.0.0.0}:${WF_PORT:-5500}:5500'
    environment:
      HOST: 0.0.0.0
      PORT: '5500'
      DATA_DIR: /data
      BUCKET: ${BUCKET:-local}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      NO_AUTH: ${NO_AUTH:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - wf-data:/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  wf-data:
    name: web-filesystem-data
